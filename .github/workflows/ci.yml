name: ci

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node env 🏗
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies 👨🏻‍💻
        run: npm ci --no-fund

      - name: Audit dependencies 🔒
        run: |
          npm audit --audit-level=low
          npm audit signatures

      # check:node, lint, typecheck, tests under several TZ values, GitHub Pages build and dist check
      - name: Verify 👀
        run: npm run verify

      - name: Upload GitHub Pages build 📦
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  docker:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run checks in Docker 🐳
        run: |
          docker build --target check -t nuxt-utc-bucket:check .
          docker run --name nuxt-utc-bucket-check nuxt-utc-bucket:check

      - name: Preview GitHub Pages build in Docker 🐳
        run: |
          docker build --target preview -t nuxt-utc-bucket:preview .
          docker run -d --name nuxt-utc-bucket-preview -p 4173:4173 nuxt-utc-bucket:preview
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/nuxt-utc-bucket/ > index.html && break; sleep 1; done
          grep -q '/nuxt-utc-bucket/favicon.ico' index.html
          # The script must be served as JavaScript, not as the index.html fallback
          script=$(grep -o '/nuxt-utc-bucket/assets/[^"]*\.js' index.html)
          curl -fsS -o /dev/null -w '%{content_type}' "http://localhost:4173${script}" | grep -q javascript
          test "$(docker exec nuxt-utc-bucket-preview id -u)" != "0"
